<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>Simula Parintins 2026 - Urna Eletrônica Oficial</title>
	<meta name="description" content="Simulador da Urna Eletrônica das Eleições 2026 - Amazonas e Brasil.">
	<link rel="icon" type="image/svg+xml" href="index.icon.png">
	<style>
		* {
			box-sizing: border-box;
		}
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background-color: #0b1320;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-start;
			touch-action: manipulation;
		}
		#game-wrapper {
			position: relative;
			width: 100%;
			height: calc(100dvh - 55px);
			max-height: calc(100dvh - 55px);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}
		#canvas {
			display: block;
			max-width: 100%;
			max-height: 100%;
			aspect-ratio: 9 / 16;
			outline: none;
			touch-action: manipulation;
		}
		#status {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: #f1f5f9;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 10;
		}
		.loading-title {
			color: #083585;
			font-size: 26px;
			font-weight: bold;
			margin-bottom: 8px;
			text-align: center;
		}
		.loading-sub {
			color: #475569;
			font-size: 16px;
			margin-bottom: 24px;
		}
		progress {
			width: 280px;
			height: 16px;
			border-radius: 8px;
			overflow: hidden;
		}
		progress::-webkit-progress-bar {
			background-color: #cbd5e1;
			border-radius: 8px;
		}
		progress::-webkit-progress-value {
			background-color: #00c09d;
			border-radius: 8px;
		}
		#ad-container {
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 55px;
			background: #0f172a;
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 99999;
			border-top: 1px solid rgba(255, 255, 255, 0.15);
		}
	</style>
</head>
<body>
	<div id="game-wrapper">
		<canvas id="canvas">Seu navegador não suporta WebAssembly/HTML5.</canvas>

		<div id="status">
			<div class="loading-title">SIMULA PARINTINS 2026</div>
			<div class="loading-sub">Carregando urna eletrônica...</div>
			<progress id="status-progress" value="0" max="100"></progress>
		</div>
	</div>

	<!-- Container do Anúncio Adsterra no Rodapé -->
	<div id="ad-container">
		<script type="text/javascript">
			atOptions = {
				'key' : '49ce8653bfc1a024eaae9e328d4ea9f6',
				'format' : 'iframe',
				'height' : 50,
				'width' : 320,
				'params' : {}
			};
		</script>
		<script type="text/javascript" src="https://www.highrevenueformat.com/49ce8653bfc1a024eaae9e328d4ea9f6/invoke.js"></script>
	</div>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"ensureCrossOriginIsolationHeaders": false,
			"executable": "index",
			"experimentalVK": true,
			"focusCanvasOnStart": true,
			"gdextensionLibs": []
		};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');

			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					}
				},
			}).then(() => {
				statusOverlay.style.display = 'none';
			}).catch((err) => {
				console.error("Falha ao inicializar o simulador:", err);
			});
		}());
	</script>
</body>
</html>
